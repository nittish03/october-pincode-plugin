# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "06ed9fe65a2d63a7db2fdce227c977a8"
name = "October Pincode"
# After Vercel deploy, set to your production URL, e.g. https://october-pincode.vercel.app
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_app_proxy"

[auth]
# Match application_url after deploy, e.g. https://october-pincode.vercel.app/auth/callback
redirect_urls = [ "https://example.com/auth/callback" ]

[app_proxy]
url = "/apps/pincode/check"
prefix = "apps"
subpath = "pincode"
